---
fedora_packages_base:
  - curl
  - flatpak
  - gcc
  - gcc-c++
  - git-delta
  - htop
  - jq
  - make
  - nodejs
  - openssl
  - ripgrep

fedora_manage_docker_repo: true

fedora_emacs_packages:
  - emacs-pgtk
  - pandoc
  - latexmk
  - texlive-latex
  - texlive-luatex
  - texlive-collection-latexrecommended

fedora_docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

enabled_services:
  - firewalld

fedora_dotfiles:
  - src: .bashrc.d/
    dest: .bashrc.d/
    mode: preserve
  - src: .gtkrc-2.0
    dest: .gtkrc-2.0
    mode: "0644"
  - src: .config/gtk-3.0/
    dest: .config/gtk-3.0/
    mode: preserve
  - src: .config/gtk-4.0/
    dest: .config/gtk-4.0/
    mode: preserve

workstation_firewall_backend: firewalld

fedora_dev_packages:
  - croc
  - distrobox
  - gnupg
  - gnupg2-gpg-agent
  - libfido2
  - openssh-clients
  - shellcheck

fedora_flatpak_remote_name: flathub
fedora_flatpak_remote_url: https://dl.flathub.org/repo/flathub.flatpakrepo

opencode_desktop_version: "2.2.5"
# Digests published with the official GitHub release; update with the version.
opencode_desktop_rpm_checksums:
  x86_64: sha256:4feb27fe98df9b7579abd31a790d331e9aff87c95f67081beefa2aaaa76ebada
  aarch64: sha256:e84b1e03e2b4fb337ddfe015b6457a7aa0dfe171338be08e643ad66b1657033a
opencode_desktop_rpm_url: >-
  https://github.com/anomalyco/opencode/releases/download/v{{ opencode_desktop_version }}/opencode-desktop-linux-{{ ansible_facts['architecture'] }}.rpm
opencode_desktop_rpm_path: "/var/cache/opencode-desktop-{{ opencode_desktop_version }}-{{ ansible_facts['architecture'] }}.rpm"

chatgpt_desktop_enabled: false
chatgpt_desktop_supported_fedora_versions:
  - "43"
  - "44"
chatgpt_desktop_supported_architectures:
  - x86_64
  - aarch64
chatgpt_desktop_rpm_gpg_key: RPM-GPG-KEY-chatgpt-3BFA0E4AE8B8CC16A2D9BA684A3B4A566C4660E4.asc
chatgpt_desktop_rpm_repository: https://persistent.oaistatic.com/codex-app-prod/linux/rpm/$basearch

#############################################
# HYPRLAND CONFIG
# ThinkPad T480 (Intel + NVIDIA)
# Intel primary GPU + NVIDIA offload
#############################################

################
# Variables
################

$mod = SUPER

#$terminal = WINIT_UNIX_BACKEND=x11 ~/.local/bin/nvidia-run alacritty
$terminal = alacritty
$menu = rofi -show drun -config ~/.config/rofi/config.rasi
$powermenu = ~/.local/bin/powermenu

################
# Autostart
################

exec-once = hyprpaper
exec-once = waybar
exec-once = dunst

################
# Environment
################

env = AQ_DRM_DEVICES,/dev/dri/card0:/dev/dri/card1
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = LIBVA_DRIVER_NAME,iHD
env = WLR_NO_HARDWARE_CURSORS,1

################
# Monitor
################

monitor = ,preferred,auto,1

################
# Input
################

input {

    kb_layout = us
    kb_variant = alt-intl

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }

}

################
# General
################

general {

    layout = master

    gaps_in = 6
    gaps_out = 10

    border_size = 1

    col.active_border = rgb(ffffff)
    col.inactive_border = rgb(1a1a1a)

    allow_tearing = false
}

################
# Master layout
################

master {

    new_status = master
    mfact = 0.55
    inherit_fullscreen = true

}

################
# Decoration
################

decoration {

    rounding = 0

    blur {
        enabled = false
    }

}

################
# Animations
################

animations {

    enabled = yes

    bezier = easeOut, 0.16, 1, 0.3, 1

    animation = windows,1,4,easeOut
    animation = fade,1,4,easeOut
    animation = workspaces,1,4,easeOut
}

################
# Misc
################

misc {

    disable_hyprland_logo = true
    disable_splash_rendering = true

}

################
# Window rules
################

windowrulev2 = opacity 0.96 0.96,class:^(Alacritty)$
windowrulev2 = float,class:^(Rofi)$

################
# Keybinds
################

# Terminal
bind = $mod, Return, exec, $terminal

# Launcher
bind = $mod, D, exec, $menu

# Powermenu
bind = $mod, Escape, exec, $powermenu

# Exit Hyprland (default)
bind = $mod SHIFT, E, exit

# Close window
bind = $mod, Q, killactive

# Fullscreen
bind = $mod, F, fullscreen, 1

# Floating
bind = $mod, Space, togglefloating

################
# Focus movement
################

bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

################
# Master navigation
################

bind = $mod, J, layoutmsg, cyclenext
bind = $mod, K, layoutmsg, cycleprev

################
# Workspaces
################

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

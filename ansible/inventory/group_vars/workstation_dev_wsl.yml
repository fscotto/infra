---
# Claude Code is managed only on the Fedora WSL development profile.
claude_code_install_enabled: true
claude_code_uninstall_enabled: false

enabled_services:
  - docker

workstation_dev_wsl_packages:
  - buildah
  - helm
  # Fedora ships the kubectl client binary in the kubernetes-client package.
  - kubernetes-client
  - pinentry-curses
  - python3-pip
  - tmux

# Maven version pinned in the devcontainer images; update it deliberately.
workstation_maven_version: 3.9.16
workstation_cdp_node_version: 20.18.3

workstation_is_wsl: true
workstation_wsl_systemd_enabled: true
workstation_dev_wsl_dotfiles:
  - src: .gnupg/gpg-agent.conf
    dest: .gnupg/gpg-agent.conf
    mode: "0600"
  - src: .tmux.conf
    dest: .tmux.conf
    mode: "0644"
    source_dir: desktop
  - src: .tmux/bin/
    dest: .tmux/bin/
    mode: preserve
    source_dir: desktop

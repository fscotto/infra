---
- name: Restart Aegis systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved.service
    state: restarted

- name: Reload Aegis SSH
  ansible.builtin.systemd:
    name: sshd.service
    state: reloaded

- name: Restart Aegis AdGuard Quadlet
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
    daemon_reload: true
  loop:
    - adguardhome.service
  loop_control:
    label: "{{ item }}"

- name: Reload Aegis systemd
  ansible.builtin.systemd:
    daemon_reload: true

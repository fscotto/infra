---
ansible_python_interpreter: /usr/bin/python3
username: fscotto
user_group: fscotto
user_home: "/home/{{ username }}"
user_shell: /bin/bash
effective_username: "{{ username }}"
effective_user_group: "{{ user_group }}"
effective_user_home: "{{ user_home }}"
emacs_enabled: false

emacs_dotfiles:
  - name: Bash Emacs client fragment
    src: .bashrc.d/25-emacs-client-desktop.sh
    dest: .bashrc.d/25-emacs-client-desktop.sh
    mode: "0644"
  - name: Emacs authoring configuration
    src: .emacs.d/
    dest: .emacs.d/
    mode: preserve

emacs_authoring_directories:
  - .bashrc.d
  - Org
  - Org/documentation
  - Org/meetings
  - Org/projects

emacs_authoring_files:
  - name: Org HTML stylesheet
    src: .emacs.d/templates/org/org.css
    dest: Org/org.css
    mode: "0644"

xdg_user_directories:
  - Desktop
  - Documents
  - Downloads
  - Music
  - Pictures
  - Public
  - Templates
  - Videos

common_packages:
  - bash-completion
  - bat
  - entr
  - fzf
  - git
  - jq
  - tree
  - unzip
  - vim
  - wget
  - zip
  - zoxide

vim_plugins_enabled: true
vim_plugin_distro_packages:
  - fzf
  - vim-fugitive
vim_plugin_source_plugins:
  - name: fzf
    repo: https://github.com/junegunn/fzf.git
    version: v0.72.0
  - name: fzf.vim
    repo: https://github.com/junegunn/fzf.vim.git
    version: 34a564c81f36047f50e593c1656f4580ff75ccca

common_dotfiles:
  - name: .bashrc
    src: .bashrc
    dest: .bashrc
    mode: "0644"
  - name: .bash_profile
    src: .bash_profile
    dest: .bash_profile
    mode: "0644"
  - name: .bashrc.aliases
    src: .bashrc.aliases
    dest: .bashrc.aliases
    mode: "0644"
  - name: .vimrc
    src: .vimrc
    dest: .vimrc
    mode: "0644"
  - name: bat config
    src: .config/bat/
    dest: .config/bat/
    mode: preserve

ai_agents_npm_packages:
  - name: "opencode-ai"
    state: latest
  - name: "@anthropic-ai/claude-code"
    state: latest
  - name: "@openai/codex"
    state: latest
  - name: "@google/gemini-cli"
    state: latest
  - name: "@githubnext/github-copilot-cli"
    state: latest

ai_agents_enabled: true

ai_agents_dotfiles:
  - name: AI common config
    src: .config/ai/
    dest: .config/ai/
    mode: preserve
  - name: Gemini CLI config
    src: .gemini/
    dest: .gemini/
    mode: preserve
  - name: OpenCode config
    src: .config/opencode/
    dest: .config/opencode/
    mode: preserve
  - name: Claude Code memory
    src: .claude/
    dest: .claude/
    mode: preserve

ai_agents_templates:
  - name: Codex config
    src: .codex/config.toml.j2
    dest: .codex/config.toml
    mode: "0644"

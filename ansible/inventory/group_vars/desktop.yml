---
desktop_manage_icloud_keyring: false
desktop_protonmail_bridge_cert_path: ~/.var/app/ch.protonmail.protonmail-bridge/config/protonmail/bridge-v3/cert.pem

desktop_sessions_enabled:
  - i3

desktop_default_session: i3
desktop_default_session_env: xorg
desktop_restart_emptty_automatically: false
desktop_emptty_session_error_logging: disabled

desktop_common_packages:
  - brightnessctl
  - dex
  - dunst
  - emptty
  - network-manager-applet
  - rofi
  - udiskie
  - xfce-polkit
  - xdg-desktop-portal
  - xdg-desktop-portal-gtk

desktop_i3_packages:
  - arandr
  - autorandr
  - feh
  - i3
  - i3blocks
  - i3blocks-blocklets
  - i3lock-color
  - i3status
  - scrot
  - setxkbmap
  - volumeicon
  - xclip
  - xfce4-clipman-plugin
  - xfce4-screenshooter
  - xkbutils
  - xorg-fonts
  - xorg-minimal
  - xss-lock

desktop_hyprland_packages:
  - grim
  - hypridle
  - hyprland
  - xorg-server-xwayland
  - hyprland-qtutils
  - hyprlock
  - hyprpaper
  - slurp
  - Waybar
  - wl-clipboard
  - xdg-desktop-portal-hyprland

profile_packages:
  - alacritty
  - bluez
  - blueman
  - celluloid
  - chromium
  - deluge-gtk
  - emacs-gtk3
  - exo
  - fontconfig-devel
  - freetype-devel
  - gufw
  - libspa-bluetooth
  - libreoffice
  - liberation-fonts-ttf
  - libvterm-devel
  - libX11-devel
  - libXft-devel
  - meld
  - mpv
  - nerd-fonts-symbols-ttf
  - pdfarranger
  - playerctl
  - remmina
  - ristretto
  - rsync
  - shotwell
  - terminus-font
  - Thunar
  - thunar-volman
  - wireplumber
  - xarchiver
  - xournalpp
  - yaru
  - yaru-plus

desktop_common_dotfiles:
  - name: XDG autostart entries
    src: .config/autostart/
    dest: .config/autostart/
    mode: preserve
  - name: dunst config
    src: .config/dunst/
    dest: .config/dunst/
    mode: preserve
  - name: alacritty config
    src: .config/alacritty/
    dest: .config/alacritty/
    mode: preserve
  - name: Thunar config
    src: .config/Thunar/
    dest: .config/Thunar/
    mode: preserve
  - name: rofi config
    src: .config/rofi/
    dest: .config/rofi/
    mode: preserve
  - name: fastfetch config
    src: .config/fastfetch/
    dest: .config/fastfetch/
    mode: preserve
  - name: fontconfig fallback
    src: .config/fontconfig/
    dest: .config/fontconfig/
    mode: preserve
  - name: WirePlumber config
    src: .config/wireplumber/
    dest: .config/wireplumber/
    mode: preserve
  - name: yt-dlp config
    src: .config/yt-dlp/
    dest: .config/yt-dlp/
    mode: preserve
  - name: .gitignore_global
    src: .gitignore_global
    dest: .gitignore_global
    mode: "0644"
  - name: .themes.gitignore
    src: .themes.gitignore
    dest: .themes.gitignore
    mode: "0644"
  - name: Emacs config
    src: .emacs.d/
    dest: .emacs.d/
    mode: preserve
  - name: GTK theme setup script
    src: .local/bin/setup-gtk-theme
    dest: .local/bin/setup-gtk-theme
    mode: "0755"
  - name: Lock session script
    src: .local/bin/lock-session
    dest: .local/bin/lock-session
    mode: "0755"
  - name: Powermenu script
    src: .local/bin/powermenu
    dest: .local/bin/powermenu
    mode: "0755"

desktop_i3_dotfiles:
  - name: i3 config
    src: .config/i3/
    dest: .config/i3/
    mode: preserve
  - name: i3blocks config
    src: .config/i3blocks/
    dest: .config/i3blocks/
    mode: preserve
  - name: .xinitrc
    src: .xinitrc
    dest: .xinitrc
    mode: "0644"

desktop_hyprland_dotfiles:
  - name: Hyprland config
    src: .config/hypr/
    dest: .config/hypr/
    mode: preserve
  - name: Waybar config
    src: .config/waybar/
    dest: .config/waybar/
    mode: preserve
  - name: Hyprland session wrapper
    src: .local/bin/start-hyprland-session
    dest: .local/bin/start-hyprland-session
    mode: "0755"
  - name: Wayland screenshot script
    src: .local/bin/screenshot-wayland
    dest: .local/bin/screenshot-wayland
    mode: "0755"

desktop_flatpak_packages:
  - be.alexandervanhee.gradia
  - ch.protonmail.protonmail-bridge
  - com.discordapp.Discord
  - com.calibre_ebook.calibre
  - com.github.tchx84.Flatseal
  - com.spotify.Client
  - io.github.flattool.Warehouse
  - org.telegram.desktop
  - sh.loft.devpod

desktop_flatpak_extensions:
  - org.gtk.Gtk3theme.Yaru-Blue-dark//stable

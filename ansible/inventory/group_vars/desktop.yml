---
desktop_protonmail_bridge_cert_path: ~/.var/app/ch.protonmail.protonmail-bridge/config/protonmail/bridge-v3/cert.pem

desktop_sessions_enabled:
  - i3

desktop_default_session: i3
desktop_default_session_env: xorg
desktop_restart_emptty_automatically: false
desktop_emptty_session_error_logging: disabled
desktop_ollama_enabled: false

desktop_common_packages:
  - brightnessctl
  - dex
  - emptty
  - pinentry-emacs
  - pinentry-gtk
  - turnstile
  - udiskie
  - xdg-desktop-portal
  - xdg-desktop-portal-gtk
  - xdg-user-dirs

desktop_i3_packages:
  - arandr
  - autorandr
  - feh
  - i3
  - i3blocks
  - i3blocks-blocklets
  - i3lock-color
  - i3status
  - dunst
  - network-manager-applet
  - rofi
  - scrot
  - setxkbmap
  - blueman
  - volumeicon
  - xclip
  - xfce-polkit
  - xfce4-clipman-plugin
  - xfce4-screenshooter
  - xkbutils
  - xorg-fonts
  - xorg-minimal
  - xss-lock

desktop_sway_packages:
  - grim
  - kanshi
  - slurp
  - swayfx
  - wl-clipboard
  - xdg-desktop-portal-wlr

profile_packages:
  - alacritty
  - bluez
  - bridge-utils
  - celluloid
  - ctags
  - chromium
  - deluge-gtk
  - dnsmasq
  - emacs-gtk3
  - poppler-glib
  - poppler-utils
  - exo
  - fontconfig-devel
  - freetype-devel
  - gvfs-cdda
  - gvfs-mtp
  - gvfs-smb
  - gufw
  - libvirt
  - libspa-bluetooth
  - libreoffice
  - liberation-fonts-ttf
  - libvterm-devel
  - libX11-devel
  - libXft-devel
  - meld
  - mpv
  - nerd-fonts-ttf
  - nerd-fonts-symbols-ttf
  - pdfarranger
  - playerctl
  - qemu
  - qemu-firmware
  - qemu-img
  - qemu-tools
  - remmina
  - ripgrep
  - rustup
  - ristretto
  - rsync
  - shotwell
  - ruff
  - terminus-font
  - texlive
  - ty
  - tumbler
  - uv
  - Thunar
  - thunar-archive-plugin
  - thunar-volman
  - ffmpegthumbnailer
  - virt-manager
  - virt-manager-tools
  - wireplumber
  - xarchiver
  - xournalpp
  - yaru
  - yaru-plus
  - zstd

desktop_source_tools:
  - name: st
    repo: https://codeberg.org/fscotto/st
    build_cmd: make
    binary_name: st
    install_name: st
  - name: gf
    repo: https://github.com/nakst/gf.git
    build_cmd: ./build.sh
    binary_name: gf2
    install_name: gf
  - name: bookokrat
    repo: https://github.com/bugzmanov/bookokrat
    build_cmd: cargo build --release
    binary_name: bookokrat
    install_name: bookokrat
    build_output_path: target/release/bookokrat
  - name: llmfit
    repo: https://github.com/AlexsJones/llmfit
    build_cmd: cargo build --release
    binary_name: llmfit
    install_name: llmfit
    build_output_path: target/release/llmfit
  - name: rust-script
    repo: https://github.com/fornwall/rust-script
    build_cmd: cargo build --release
    binary_name: rust-script
    install_name: rust-script
    build_output_path: target/release/rust-script

desktop_binary_tools:
  - name: ollama
    install_name: ollama
    repo: https://github.com/ollama/ollama
    asset_arch: amd64
    install_mode: tree

desktop_npm_packages:
  - name: "opencode-ai"
    state: latest

desktop_common_dotfiles:
  - name: XDG autostart entries
    src: .config/autostart/
    dest: .config/autostart/
    mode: preserve
  - name: alacritty config
    src: .config/alacritty/
    dest: .config/alacritty/
    mode: preserve
  - name: Thunar config
    src: .config/Thunar/
    dest: .config/Thunar/
    mode: preserve
  - name: MIME application defaults
    src: .config/mimeapps.list
    dest: .config/mimeapps.list
    mode: "0644"
  - name: fastfetch config
    src: .config/fastfetch/
    dest: .config/fastfetch/
    mode: preserve
  - name: fontconfig fallback
    src: .config/fontconfig/
    dest: .config/fontconfig/
    mode: preserve
  - name: WirePlumber config
    src: .config/wireplumber/
    dest: .config/wireplumber/
    mode: preserve
  - name: yt-dlp config
    src: .config/yt-dlp/
    dest: .config/yt-dlp/
    mode: preserve
  - name: OpenCode config
    src: .config/opencode/
    dest: .config/opencode/
    mode: preserve
  - name: MPV config
    src: .config/mpv/
    dest: .config/mpv/
    mode: preserve
  - name: Udiskie config
    src: .config/udiskie/
    dest: .config/udiskie/
    mode: preserve
  - name: Turnstile user services
    src: .config/service/
    dest: .config/service/
    mode: preserve
  - name: Bash profile fragments
    src: .bashrc.d/
    dest: .bashrc.d/
    mode: preserve
  - name: .gitignore_global
    src: .gitignore_global
    dest: .gitignore_global
    mode: "0644"
  - name: .themes.gitignore
    src: .themes.gitignore
    dest: .themes.gitignore
    mode: "0644"
  - name: .tmux.conf
    src: .tmux.conf
    dest: .tmux.conf
    mode: "0644"
  - name: tmux helper scripts
    src: .tmux/bin/
    dest: .tmux/bin/
    mode: preserve
  - name: GPG authinfo for LLM APIs
    src: .authinfo.gpg
    dest: .authinfo.gpg
    mode: "0600"
  - name: GTK theme setup script
    src: .local/bin/setup-gtk-theme
    dest: .local/bin/setup-gtk-theme
    mode: "0755"
  - name: Turnstile environment update script
    src: .local/bin/update-turnstile-env
    dest: .local/bin/update-turnstile-env
    mode: "0755"
  - name: Udiskie password helper
    src: .local/bin/udiskie-password
    dest: .local/bin/udiskie-password
    mode: "0755"
  - name: SSH config
    src: .ssh/config
    dest: .ssh/config
    mode: "0600"

desktop_emacs_dotfiles:
  - name: Emacs config
    src: .emacs.d/
    dest: .emacs.d/
    mode: preserve

desktop_i3_dotfiles:
  - name: i3 config
    src: .config/i3/
    dest: .config/i3/
    mode: preserve
  - name: dunst config
    src: .config/dunst/
    dest: .config/dunst/
    mode: preserve
  - name: i3blocks config
    src: .config/i3blocks/
    dest: .config/i3blocks/
    mode: preserve
  - name: rofi config
    src: .config/rofi/
    dest: .config/rofi/
    mode: preserve
  - name: .xinitrc
    src: .xinitrc
    dest: .xinitrc
    mode: "0644"

desktop_sway_dotfiles:
  - name: Sway config
    src: .config/sway/
    dest: .config/sway/
    mode: preserve
  - name: Sway wallpaper assets
    src: .config/i3/wallpapers/
    dest: .config/sway/wallpapers/
    mode: preserve
  - name: Sway session wrapper
    src: .local/bin/start-sway-session
    dest: .local/bin/start-sway-session
    mode: "0755"

desktop_flatpak_packages:
  - be.alexandervanhee.gradia
  - ch.protonmail.protonmail-bridge
  - com.discordapp.Discord
  - com.calibre_ebook.calibre
  - com.github.tchx84.Flatseal
  - com.spotify.Client
  - io.gitlab.librewolf-community
  - io.github.flattool.Warehouse
  - org.telegram.desktop
  - sh.loft.devpod

desktop_flatpak_extensions:
  - org.gtk.Gtk3theme.Yaru-Blue-dark//stable

general {
    hide_cursor = true
    grace = 2
    no_fade_in = false
}

background {
    monitor =
    color = rgba(1f1f28ff)
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(d0d0d0ff)
    font_size = 42
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%Y-%m-%d')"
    color = rgba(9a9a9aff)
    font_size = 18
    position = 0, 35
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 56
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    outer_color = rgba(4a90d9ff)
    inner_color = rgba(1f1f28ff)
    font_color = rgba(d0d0d0ff)
    fade_on_empty = false
    placeholder_text = Password...
    position = 0, -20
    halign = center
    valign = center
}

---
fedora_packages_base:
  - curl
  - flatpak
  - gcc
  - gcc-c++
  - git-delta
  - htop
  - jq
  - make
  # Keep the LTS stream explicit.  Fedora 45's rolling `nodejs` package
  # conflicts with the nodejs22-bin alternative installed by the F44→F45
  # upgrade.
  - nodejs22
  - openssl
  - ripgrep

fedora_manage_docker_repo: true

fedora_emacs_packages:
  - emacs-pgtk
  - pandoc
  - latexmk
  - texlive-latex
  - texlive-luatex
  - texlive-collection-latexrecommended

fedora_docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

enabled_services:
  - firewalld

fedora_dotfiles:
  - src: .bashrc.d/
    dest: .bashrc.d/
    mode: preserve
  - src: .gtkrc-2.0
    dest: .gtkrc-2.0
    mode: "0644"
  - src: .config/gtk-3.0/
    dest: .config/gtk-3.0/
    mode: preserve
  - src: .config/gtk-4.0/
    dest: .config/gtk-4.0/
    mode: preserve

workstation_firewall_backend: firewalld

fedora_dev_packages:
  - croc
  - distrobox
  - gnupg
  - gnupg2-gpg-agent
  - libfido2
  - openssh-clients
  - shellcheck

fedora_flatpak_remote_name: flathub
fedora_flatpak_remote_url: https://dl.flathub.org/repo/flathub.flatpakrepo

cline_desktop_version: "0.0.49"
# Launcher file shipped by the pinned RPM; the GNOME profile pins it in the
# favorites while installation stays enabled.
cline_desktop_launcher: Cline.desktop
# Digests published with the official GitHub release; update with the version.
cline_desktop_rpm_checksums:
  x86_64: sha256:e10036a036ee531451695559e2c96feceb3d621408a6615bdd708ffcf9e778ab
  aarch64: sha256:aec36edb594bdc400b0c2275230f29de6814a78ad60add4938347d20cfb93b74
cline_desktop_rpm_url: >-
  https://github.com/cline/cline/releases/download/desktop-v{{ cline_desktop_version }}/Cline_{{ cline_desktop_version }}_{{ ansible_facts['architecture'] }}.rpm
cline_desktop_rpm_path: "/var/cache/cline-desktop-{{ cline_desktop_version }}-{{ ansible_facts['architecture'] }}.rpm"

# OpenCode Desktop was replaced by Cline Desktop. The pinned release stays
# available for reinstall, while removal is selected in the lifecycle flags
# below so leftovers from the switch converge away on graphical hosts.
opencode_desktop_version: "2.2.5"
# Digests published with the official GitHub release; update with the version.
opencode_desktop_rpm_checksums:
  x86_64: sha256:4feb27fe98df9b7579abd31a790d331e9aff87c95f67081beefa2aaaa76ebada
  aarch64: sha256:e84b1e03e2b4fb337ddfe015b6457a7aa0dfe171338be08e643ad66b1657033a
opencode_desktop_rpm_url: >-
  https://github.com/anomalyco/opencode/releases/download/v{{ opencode_desktop_version }}/opencode-desktop-linux-{{ ansible_facts['architecture'] }}.rpm
opencode_desktop_rpm_path: "/var/cache/opencode-desktop-{{ opencode_desktop_version }}-{{ ansible_facts['architecture'] }}.rpm"

# AI desktop-app lifecycle controls are independent for every app and mirror
# the CLI coding-agent flags. Installation and removal are mutually exclusive
# per app; the common pre-task enforces this before any changes are made.
# ChatGPT opts in per host, Cline opts in through desktop_gnome group vars.
chatgpt_desktop_install_enabled: false
chatgpt_desktop_uninstall_enabled: false
opencode_desktop_install_enabled: false
opencode_desktop_uninstall_enabled: true

ai_desktop_apps:
  chatgpt_desktop:
    install_enabled: "{{ chatgpt_desktop_install_enabled }}"
    uninstall_enabled: "{{ chatgpt_desktop_uninstall_enabled }}"
  opencode_desktop:
    install_enabled: "{{ opencode_desktop_install_enabled }}"
    uninstall_enabled: "{{ opencode_desktop_uninstall_enabled }}"
  cline_desktop:
    install_enabled: "{{ cline_desktop_install_enabled | default(false) }}"
    uninstall_enabled: "{{ cline_desktop_uninstall_enabled | default(false) }}"

chatgpt_desktop_supported_fedora_versions:
  - "43"
  - "44"
  - "45"
chatgpt_desktop_supported_architectures:
  - x86_64
  - aarch64
chatgpt_desktop_rpm_gpg_key: RPM-GPG-KEY-chatgpt-3BFA0E4AE8B8CC16A2D9BA684A3B4A566C4660E4.asc
chatgpt_desktop_rpm_repository: https://persistent.oaistatic.com/codex-app-prod/linux/rpm/$basearch

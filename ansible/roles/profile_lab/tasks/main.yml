---
- name: Ensure lab workspace directories exist
  tags: [dotfiles]
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ username }}"
    group: "{{ user_group }}"
    mode: "{{ item.mode }}"
  loop: "{{ lab_workspace_directories | default([]) }}"
  loop_control:
    label: "{{ item.path }}"

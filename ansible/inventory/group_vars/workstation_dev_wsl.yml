---
enabled_services:
  - docker

workstation_dev_wsl_packages:
  - pinentry-curses
  - python3-pip
  - tmux
workstation_is_wsl: true
workstation_wsl_systemd_enabled: true
workstation_dev_wsl_dotfiles:
  - src: .gnupg/gpg-agent.conf
    dest: .gnupg/gpg-agent.conf
    mode: "0600"
  - src: .tmux.conf
    dest: .tmux.conf
    mode: "0644"
    source_dir: desktop
  - src: .tmux/bin/
    dest: .tmux/bin/
    mode: preserve
    source_dir: desktop

---
desktop_manage_icloud_keyring: false
desktop_protonmail_bridge_cert_path: ~/.var/app/ch.protonmail.protonmail-bridge/config/protonmail/bridge-v3/cert.pem

desktop_x11_packages:
  - arandr
  - autorandr
  - brightnessctl
  - dex
  - dunst
  - emptty
  - feh
  - i3
  - i3blocks
  - i3blocks-blocklets
  - i3lock-color
  - i3status
  - network-manager-applet
  - rofi
  - scrot
  - setxkbmap
  - udiskie
  - volumeicon
  - xclip
  - xfce-polkit
  - xfce4-clipman-plugin
  - xfce4-screenshooter
  - xkbutils
  - xdg-desktop-portal
  - xdg-desktop-portal-gtk
  - xorg-fonts
  - xorg-minimal
  - xss-lock

profile_packages:
  - alacritty
  - bluez
  - blueman
  - celluloid
  - chromium
  - deluge-gtk
  - emacs-gtk3
  - exo
  - fontconfig-devel
  - freetype-devel
  - gufw
  - libspa-bluetooth
  - libreoffice
  - liberation-fonts-ttf
  - libvterm-devel
  - libX11-devel
  - libXft-devel
  - meld
  - mpv
  - nerd-fonts-symbols-ttf
  - pdfarranger
  - playerctl
  - remmina
  - ristretto
  - rsync
  - shotwell
  - terminus-font
  - Thunar
  - thunar-volman
  - wireplumber
  - xarchiver
  - xournalpp
  - yaru
  - yaru-plus

desktop_dotfiles:
  - name: XDG autostart entries
    src: .config/autostart/
    dest: .config/autostart/
    mode: preserve
  - name: i3 config
    src: .config/i3/
    dest: .config/i3/
    mode: preserve
  - name: i3blocks config
    src: .config/i3blocks/
    dest: .config/i3blocks/
    mode: preserve
  - name: dunst config
    src: .config/dunst/
    dest: .config/dunst/
    mode: preserve
  - name: alacritty config
    src: .config/alacritty/
    dest: .config/alacritty/
    mode: preserve
  - name: Thunar config
    src: .config/Thunar/
    dest: .config/Thunar/
    mode: preserve
  - name: rofi config
    src: .config/rofi/
    dest: .config/rofi/
    mode: preserve
  - name: fastfetch config
    src: .config/fastfetch/
    dest: .config/fastfetch/
    mode: preserve
  - name: fontconfig fallback
    src: .config/fontconfig/
    dest: .config/fontconfig/
    mode: preserve
  - name: WirePlumber config
    src: .config/wireplumber/
    dest: .config/wireplumber/
    mode: preserve
  - name: yt-dlp config
    src: .config/yt-dlp/
    dest: .config/yt-dlp/
    mode: preserve
  - name: .xinitrc
    src: .xinitrc
    dest: .xinitrc
    mode: "0644"
  - name: .gitignore_global
    src: .gitignore_global
    dest: .gitignore_global
    mode: "0644"
  - name: .themes.gitignore
    src: .themes.gitignore
    dest: .themes.gitignore
    mode: "0644"
  - name: Emacs config
    src: .emacs.d/
    dest: .emacs.d/
    mode: preserve

desktop_flatpak_packages:
  - be.alexandervanhee.gradia
  - ch.protonmail.protonmail-bridge
  - com.discordapp.Discord
  - com.calibre_ebook.calibre
  - com.github.tchx84.Flatseal
  - com.spotify.Client
  - io.github.flattool.Warehouse
  - org.telegram.desktop
  - sh.loft.devpod

desktop_flatpak_extensions:
  - org.gtk.Gtk3theme.Yaru-Blue-dark//stable

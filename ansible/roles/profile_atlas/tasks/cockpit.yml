---
- name: Configure the official 45Drives repository
  tags: [atlas, packages]
  ansible.builtin.get_url:
    url: "{{ atlas_45drives_repo_url }}"
    dest: "{{ atlas_45drives_repo_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Install 45Drives Cockpit plugins
  tags: [atlas, packages]
  ansible.builtin.dnf:
    name: "{{ atlas_45drives_packages }}"
    state: present

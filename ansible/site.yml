---
- hosts: all
  become: true

  roles:
    - dotfiles_common

- hosts: void
  become: true
  pre_tasks:
    - name: Load local vault variables when available
      tags: [always]
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../secrets/vault.yml"
      when: lookup('ansible.builtin.fileglob', playbook_dir + '/../secrets/vault.yml', errors='ignore') != ''

  roles:
    - packages_void
    - services_runit
    - profile_desktop_i3

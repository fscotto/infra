---
desktop_profile: gnome
desktop_environment: gnome
desktop_sessions_enabled: []
desktop_default_session: gnome
emacs_enabled: true

# Fedora Workstation/GNOME desktop applications. Keep this profile separate from
# workstation_* so nymph can remain a desktop laptop rather than a dev workstation.
fedora_desktop_packages:
  # Fedora equivalents of the development/tooling packages previously pulled by
  # the Void desktop profile.
  - 7zip
  - nodejs-bash-language-server
  - bluez
  - bridge-utils
  - clang-tools-extra
  - cmake
  - cscope
  - ctags
  - croc
  - delve
  - dnsmasq
  - evolution
  - fastfetch
  - poppler-glib
  - poppler-utils
  - fontconfig-devel
  - freetype-devel
  - gh
  - golang
  - golangci-lint
  - gopls
  - gnome-shell-extension-gsconnect
  - hunspell
  - libvirt
  - liberation-fonts
  - libasan
  - libubsan
  - libX11-devel
  - libXft-devel
  - meld
  - mpv
  - pdfarranger
  - pinentry-gnome3
  - plocate
  - playerctl
  - podman-compose
  - qemu
  - qemu-img
  - qemu-tools
  - rclone
  - remmina
  - rpi-imager
  - ruff
  - rustup
  - rsync
  - shfmt
  - seahorse
  - syncthing
  - tealdeer
  - terminus-fonts
  - tmux
  - wl-clipboard
  - ty
  - uv
  - valgrind
  - virt-manager
  - virt-install
  - wireplumber
  - yt-dlp
  - zstd

fedora_nerd_fonts_version: v3.3.0
fedora_nerd_fonts:
  - Hack
  - JetBrainsMono
  - Iosevka
  - UbuntuSans
  - NerdFontsSymbolsOnly

fedora_flatpak_packages:
  - be.alexandervanhee.gradia
  - ch.protonmail.protonmail-bridge
  - com.spotify.Client
  - org.onlyoffice.desktopeditors
  - org.telegram.desktop

fedora_npm_packages: "{{ ai_agents_npm_packages }}"

---
emacs_enabled: true

workstation_git_https_cas:
  - url: https://gitlab.ecaas.datacenter.comune.roma
    certificate: ecaas.datacenter.comune.roma.crt
  - url: https://gitlab.datacenter.comune.roma
    certificate: datacenter.comune.roma.crt

workstation_user_directories:
  - path: "{{ user_home }}/.config"
    mode: "0755"
  - path: "{{ user_home }}/.local"
    mode: "0755"
  - path: "{{ user_home }}/.local/bin"
    mode: "0755"
  - path: "{{ user_home }}/.gnupg"
    mode: "0700"

workstation_dotfiles:
  - src: .gitignore_global
    dest: .gitignore_global
    mode: "0644"
  - src: .themes.gitignore
    dest: .themes.gitignore
    mode: "0644"

workstation_templates:
  - src: workstation/.gitconfig.j2
    dest: .gitconfig
    mode: "0644"

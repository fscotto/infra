general {
  hide_cursor = true
  immediate_render = true
  fail_timeout = 1800
}

background {
  monitor =
  path = ~/.config/hypr/wallpapers/maxresdefault.jpg
  blur_passes = 1
  blur_size = 3
  brightness = 0.55
  contrast = 0.95
  vibrancy = 0.18
  vibrancy_darkness = 0.08
}

shape {
  monitor =
  size = 560, 360
  color = rgba(06070dcc)
  rounding = 24
  border_size = 2
  border_color = rgba(f5c542ee)
  shadow_passes = 2
  shadow_size = 10
  shadow_color = rgba(00000099)
  position = 0, -5
  halign = center
  valign = center
}

label {
  monitor =
  text = $TIME
  color = rgba(f5c542ff)
  font_size = 78
  font_family = Noto Sans
  shadow_passes = 2
  shadow_size = 4
  shadow_color = rgba(000000cc)
  position = 0, 105
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:60000] date '+%A %d %B %Y'
  color = rgba(e6d3a3ee)
  font_size = 18
  font_family = Noto Sans
  shadow_passes = 1
  shadow_size = 3
  shadow_color = rgba(000000bb)
  position = 0, 20
  halign = center
  valign = center
}

label {
  monitor =
  text = $USER
  color = rgba(d7d7d7ee)
  font_size = 16
  font_family = Noto Sans
  shadow_passes = 1
  shadow_size = 3
  shadow_color = rgba(000000bb)
  position = 0, -24
  halign = center
  valign = center
}

input-field {
  monitor =
  size = 360, 54
  outline_thickness = 2
  dots_size = 0.25
  dots_spacing = 0.20
  dots_center = true
  rounding = -1
  outer_color = rgba(f5c542ee)
  inner_color = rgba(11131bdd)
  font_color = rgba(f5c542ff)
  check_color = rgba(4a90d9ff)
  fail_color = rgba(c7162bff)
  capslock_color = rgba(ffd166ff)
  placeholder_text = <i>Access code</i>
  fail_text = <i>Access denied <b>($ATTEMPTS)</b></i>
  fade_on_empty = false
  shadow_passes = 2
  shadow_size = 6
  shadow_color = rgba(000000aa)
  position = 0, -90
  halign = center
  valign = center
}

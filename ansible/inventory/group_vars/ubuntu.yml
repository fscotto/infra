---
ubuntu_packages_base:
  - curl
  - ufw
  - htop
  - build-essential
  - nodejs
  - git-delta
  - jq
  - ripgrep

ubuntu_manage_docker_repo: true

ubuntu_emacs_packages:
  - emacs
  - pandoc
  - latexmk
  - texlive-luatex
  - texlive-latex-base
  - texlive-latex-recommended
  - texlive-fonts-recommended

ubuntu_docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

enabled_services:
  - ufw
  - docker

ubuntu_dotfiles:
  - src: .bashrc.d/
    dest: .bashrc.d/
    mode: preserve

  - name: dunst config
    src: .config/dunst/
    dest: .config/dunst/
    mode: preserve
  - name: rofi config
    src: .config/rofi/
    dest: .config/rofi/
    mode: preserve
  - name: hyprland config
    src: .config/hypr/
    dest: .config/hypr/
    mode: preserve
  - name: waybar config
    src: .config/waybar/
    dest: .config/waybar/

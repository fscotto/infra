---
desktop_profile: gnome
desktop_environment: gnome
desktop_sessions_enabled: []
desktop_default_session: gnome
emacs_enabled: true
cline_desktop_enabled: true
cline_desktop_launcher: Cline.desktop

# Fedora Workstation/GNOME desktop applications. Keep this profile separate from
# workstation_* so nymph can remain a desktop laptop rather than a dev workstation.
fedora_desktop_packages:
  # Fedora equivalents of the development/tooling packages previously pulled by
  # the Void desktop profile.
  - 7zip
  - arm-image-installer
  - nodejs-bash-language-server
  - bluez
  - bridge-utils
  - clang-tools-extra
  - cmake
  - cscope
  - ctags
  - croc
  - delve
  - dnsmasq
  - thunderbird
  - fastfetch
  - poppler-glib
  - poppler-utils
  - fontconfig-devel
  - freetype-devel
  - gh
  - golang
  - golangci-lint
  - gopls
  - gnome-shell-extension-gsconnect
  - hunspell
  - libvirt
  - liberation-fonts
  - libasan
  - libubsan
  - libX11-devel
  - libXft-devel
  - meld
  - mpv
  - nextcloud-client
  - pdfarranger
  - pinentry-gnome3
  - plocate
  - playerctl
  - podman-compose
  - qemu
  - qemu-img
  - qemu-tools
  - rclone
  - remmina
  - rpi-imager
  - ruff
  - rustup
  - rsync
  - shfmt
  - seahorse
  - syncthing
  - tealdeer
  - terminus-fonts
  - tmux
  - wl-clipboard
  - ty
  - uv
  - valgrind
  - virt-manager
  - virt-install
  - wireplumber
  - yt-dlp
  - zstd

fedora_removed_packages:
  - evolution
  - evolution-langpacks

fedora_nerd_fonts_version: v3.3.0
fedora_nerd_fonts:
  - Hack
  - JetBrainsMono
  - Iosevka
  - UbuntuSans
  - NerdFontsSymbolsOnly

fedora_flatpak_packages:
  - be.alexandervanhee.gradia
  - com.spotify.Client
  - org.onlyoffice.desktopeditors
  - org.telegram.desktop

# GNOME-only dotfiles. Kept out of desktop_common_dotfiles so the Void desktops
# do not receive XDG autostart entries for applications they do not install.
# Nextcloud desktop is the `nextcloud-client` package in fedora_desktop_packages;
# this entry matches what the client itself writes when "Launch on startup" is on.
desktop_gnome_dotfiles:
  - name: Nextcloud autostart entry
    src: .config/autostart/Nextcloud.desktop
    dest: .config/autostart/Nextcloud.desktop
    mode: "0644"

# Thunderbird is provisioned from a seeded profile plus a managed user.js:
# Existing Thunderbird accounts are reused without changing their preferences.
# Only a new profile receives account, calendar and address book defaults in user.js.
# The address comes from Vault; the app-specific password is never stored here
# and is requested by Thunderbird on first use.
thunderbird_icloud_enabled: true
thunderbird_profile_name: "{{ username }}"
thunderbird_profile_dir: "{{ username }}.default-release"
thunderbird_full_name: "{{ vault_personal_full_name | default(username) }}"
thunderbird_icloud_email: "{{ vault_icloud_email }}"
thunderbird_icloud_account_name: iCloud
thunderbird_icloud_imap_host: imap.mail.me.com
thunderbird_icloud_imap_port: 993
thunderbird_icloud_smtp_host: smtp.mail.me.com
thunderbird_icloud_smtp_port: 587
thunderbird_icloud_caldav_url: https://caldav.icloud.com/
thunderbird_icloud_carddav_url: https://contacts.icloud.com/
thunderbird_icloud_calendar_id: 4f2c1d6e-9b3a-4f7c-8e21-6d5a0c9b7e13
thunderbird_icloud_addressbook_uid: 9e0b7c4a-2d51-4a8f-b6c3-1f7d5e2a8b46

# Native VS Code; opt in to managing settings only after defining them.
vscode_extensions:
  - esbenp.prettier-vscode
  - github.remotehub
  - ms-azuretools.vscode-containers
  - ms-azuretools.vscode-docker
  - ms-vscode-remote.remote-containers
  - ms-vscode-remote.remote-ssh
  - ms-vscode-remote.remote-ssh-edit
  - ms-vscode-remote.remote-wsl
  - ms-vscode-remote.vscode-remote-extensionpack
  - ms-vscode.azure-repos
  - ms-vscode.remote-explorer
  - ms-vscode.remote-repositories
  - ms-vscode.remote-server
  - redhat.vscode-xml
  - redhat.vscode-yaml
  - saoudrizwan.claude-dev
  - vscodevim.vim
vscode_settings: null

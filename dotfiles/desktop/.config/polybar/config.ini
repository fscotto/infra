[colors]
background     = #1f1f28
background-alt = #2b2b36
foreground     = #d0d0d0
foreground-alt = #9a9a9a
primary        = #4a90d9
secondary      = #7dcfff
warm           = #e0af68
success        = #9ec07c
info           = #bb9af7
alert          = #c7162b
disabled       = #3a3a46

[bar/main]
monitor       = ${env:MONITOR:}
bottom        = false
width         = 100%
height        = 24pt
radius        = 0
background    = ${colors.background}
foreground    = ${colors.foreground}
line-size     = 2pt
border-size   = 0
padding-left  = 1
padding-right = 1
module-margin = 1

font-0 = LiterationMono Nerd Font:size=10;2
font-1 = Symbols Nerd Font Mono:size=12;2

modules-left   = i3
modules-center = date
modules-right  = cpu memory disk temperature backlight wifi battery

tray-position = right
tray-padding  = 2

cursor-click = pointer

wm-restack = i3
override-redirect = false

[module/i3]
type            = internal/i3
pin-workspaces  = false
show-urgent     = true
strip-wsnumbers = true
enable-scroll   = false
index-sort      = true

ws-icon-0 = 1;I
ws-icon-1 = 2;II
ws-icon-2 = 3;III
ws-icon-3 = 4;IV
ws-icon-4 = 5;V
ws-icon-5 = 6;VI
ws-icon-6 = 7;VII
ws-icon-7 = 8;VIII
ws-icon-8 = 9;IX
ws-icon-9 = 10;X
ws-icon-default = 

label-focused              = %icon%
label-focused-foreground   = #ffffff
label-focused-background   = ${colors.primary}
label-focused-padding      = 1

label-unfocused            = %icon%
label-unfocused-foreground = ${colors.foreground-alt}
label-unfocused-padding    = 1

label-visible              = %icon%
label-visible-foreground   = ${colors.foreground}
label-visible-background   = ${colors.background-alt}
label-visible-padding      = 1

label-urgent               = %icon%
label-urgent-foreground    = #ffffff
label-urgent-background    = ${colors.alert}
label-urgent-padding       = 1

[module/date]
type     = internal/date
interval = 60
date     = %Y-%m-%d
time     = %H:%M
format-prefix = " "
format-prefix-foreground = ${colors.foreground-alt}
label    = %date% %time%
label-foreground = ${colors.foreground}

[module/memory]
type     = internal/memory
interval = 10
format        = <label>
format-prefix = " "
format-prefix-foreground = ${colors.secondary}
label    = %gb_used% / %gb_total%
label-foreground = ${colors.secondary}

[module/temperature]
type             = internal/temperature
interval         = 10
thermal-zone     = 0
warn-temperature = 80
format           = <label>
format-prefix    = " "
format-prefix-foreground = ${colors.warm}
format-warn      = <label-warn>
format-warn-prefix = " "
format-warn-prefix-foreground = ${colors.alert}
label            = %temperature-c%
label-foreground = ${colors.warm}
label-warn       = %temperature-c%
label-warn-foreground = ${colors.alert}

[module/backlight]
type                  = internal/backlight
card                  = intel_backlight
use-actual-brightness = true
enable-scroll         = true
format                = <label>
format-prefix         = " "
format-prefix-foreground = ${colors.foreground}
label                 = %percentage%%
label-foreground      = ${colors.foreground}

[module/wifi]
type           = internal/network
interface-type = wireless
interval       = 5
format-connected           = <label-connected>
format-connected-prefix    = " "
format-connected-prefix-foreground = ${colors.primary}
format-disconnected        = <label-disconnected>
format-disconnected-prefix = " "
format-disconnected-prefix-foreground = ${colors.disabled}
label-connected            = %essid% %signal%%
label-connected-foreground = ${colors.primary}
label-disconnected         = offline
label-disconnected-foreground = ${colors.disabled}

[module/battery]
type    = internal/battery
battery = BAT0
adapter = AC
full-at = 98
low-at  = 15

format-charging    = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full        = <label-full>
format-low         = <label-low>

format-full-prefix            = " "
format-full-prefix-foreground = ${colors.success}

label-charging                 = %percentage%%
label-charging-foreground      = ${colors.success}
label-discharging              = %percentage%%
label-discharging-foreground   = ${colors.foreground}
label-full                     = full
label-full-foreground          = ${colors.success}
label-low                      = %percentage%%
label-low-foreground           = ${colors.alert}

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${colors.foreground}

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-foreground = ${colors.success}
animation-charging-framerate  = 750

[module/cpu]
type     = internal/cpu
interval = 5
format        = <label>
format-prefix = " "
format-prefix-foreground = ${colors.info}
label    = %percentage%%
label-foreground = ${colors.info}

[module/disk]
type     = internal/fs
mount-0  = /
interval = 60
format-mounted        = <label-mounted>
format-mounted-prefix = " "
format-mounted-prefix-foreground = ${colors.success}
label-mounted         = %used% / %total%
label-mounted-foreground = ${colors.success}
format-unmounted        = <label-unmounted>
format-unmounted-prefix = " "
format-unmounted-prefix-foreground = ${colors.disabled}
label-unmounted         = %mountpoint% n/a
label-unmounted-foreground = ${colors.disabled}

[settings]
screenchange-reload = true
pseudo-transparency = false

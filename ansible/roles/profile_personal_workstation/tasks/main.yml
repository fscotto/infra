---
- name: Ensure personal workstation directories exist
  tags: [dotfiles, dotfiles:workstation]
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ username }}"
    group: "{{ user_group }}"
    mode: "{{ item.mode }}"
  loop: "{{ personal_workstation_directories | default([]) }}"
  loop_control:
    label: "{{ item.path }}"

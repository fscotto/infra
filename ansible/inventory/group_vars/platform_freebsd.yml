---
platform_profile: freebsd
platform_family: freebsd
platform_package_manager: pkg
platform_service_manager: rc
ansible_python_interpreter: /usr/local/bin/python3

effective_user_group: "{{ user_group }}"
effective_user_home: "/home/{{ effective_username }}"
user_home: "/home/{{ username }}"

freebsd_packages_base:
  - bash
  - bash-completion
  - bat
  - curl
  - fzf
  - git
  - jq
  - python3
  - ripgrep
  - rsync
  - tmux
  - tree
  - unzip
  - vim
  - wget
  - zip
  - zoxide

freebsd_development_packages:
  - clang
  - cmake
  - gdb
  - go
  - gmake
  - node
  - npm
  - pkgconf
  - py311-pip
  - rust
  - shellcheck

freebsd_desktop_common_packages:
  - dbus
  - dconf
  - firefox
  - fontconfig
  - gnome-keyring
  - libsecret
  - mpv
  - pinentry-gnome
  - pipewire
  - polkit
  - thunderbird
  - wireplumber
  - xdg-desktop-portal

freebsd_hyprland_packages:
  - alacritty
  - cliphist
  - dunst
  - foot
  - grim
  - hypridle
  - hyprland
  - hyprlock
  - hyprpaper
  - rofi-wayland
  - seatd
  - slurp
  - waybar
  - wl-clipboard
  - xdg-desktop-portal-gtk
  - xdg-desktop-portal-hyprland
  - xwayland

freebsd_lab_packages:
  - lldb
  - llvm
  - podman
  - qemu
  - smartmontools

freebsd_rc_conf:
  - name: dbus_enable
    value: "YES"
  - name: seatd_enable
    value: "YES"

freebsd_enabled_services:
  - dbus
  - seatd

freebsd_xdg_config_dir: /usr/local/etc/xdg

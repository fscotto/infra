---
- name: Refuse iCloudPD startup without explicit preparation
  tags: [atlas, icloudpd]
  ansible.builtin.assert:
    that: atlas_icloudpd_prepare | bool
    fail_msg: Enable atlas_icloudpd_prepare before requesting Atlas iCloudPD startup.
  when: atlas_icloudpd_start | bool

- name: Prepare the isolated Atlas iCloudPD target without changing Aegis
  tags: [atlas, icloudpd]
  when: atlas_icloudpd_prepare | bool
  block:
    - name: Require data-protection approval and exact Atlas paths
      ansible.builtin.assert:
        that:
          - atlas_icloudpd_data_protection_verified | bool
          - atlas_manage_storage | bool
          - atlas_icloudpd_dataset == atlas_zfs_pool ~ '/services/data/icloudpd'
          - atlas_icloudpd_state_dir == atlas_app_data_mountpoint ~ '/icloudpd'
          - atlas_icloudpd_config_dir == atlas_icloudpd_state_dir ~ '/config'
          - atlas_icloudpd_photos_dir == atlas_photobook_mountpoint ~ '/iCloudPD'
          - atlas_admin_uid | int == 1000
          - atlas_admin_gid | int == 1000
          - atlas_icloudpd_image is search('@sha256:[0-9a-f]{64}$')
          - atlas_icloudpd_download_interval | int == 86400
        fail_msg: >-
          Verify Atlas data protection and the fixed, separate photo/state
          paths before preparing the temporary iCloudPD target.

    - name: Inspect the existing Photobook and application-data datasets
      community.general.zfs_facts:
        name: "{{ item.dataset }}"
        properties: name,mounted,mountpoint
      loop:
        - dataset: "{{ atlas_zfs_pool }}/{{ atlas_zfs_dataset_photobook }}"
          mountpoint: "{{ atlas_photobook_mountpoint }}"
        - dataset: "{{ atlas_zfs_pool }}/{{ atlas_zfs_dataset_app_data }}"
          mountpoint: "{{ atlas_app_data_mountpoint }}"
      loop_control:
        label: "{{ item.dataset }}"
      register: atlas_icloudpd_parent_datasets

    - name: Refuse missing or unmounted iCloudPD parent datasets
      ansible.builtin.assert:
        that:
          - item.ansible_facts.ansible_zfs_datasets | length == 1
          - item.ansible_facts.ansible_zfs_datasets[0].mounted == 'yes'
          - item.ansible_facts.ansible_zfs_datasets[0].mountpoint == item.item.mountpoint
      loop: "{{ atlas_icloudpd_parent_datasets.results }}"
      loop_control:
        label: "{{ item.item.dataset }}"

    - name: Inspect the existing Photobook namespace and proposed target
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ atlas_photobook_mountpoint }}"
        - "{{ atlas_icloudpd_photos_dir }}"
        - "{{ atlas_icloudpd_photos_dir }}/.atlas-icloudpd-managed"
      register: atlas_icloudpd_photo_paths

    - name: Refuse to adopt unrelated Photobook data or a symlink
      ansible.builtin.assert:
        that:
          - atlas_icloudpd_photo_paths.results[0].stat.isdir | default(false)
          - atlas_icloudpd_photo_paths.results[0].stat.uid | int == atlas_immich_uid | int
          - atlas_icloudpd_photo_paths.results[0].stat.gid | int == atlas_immich_gid | int
          - atlas_icloudpd_photo_paths.results[0].stat.mode == '0770'
          - >-
            not atlas_icloudpd_photo_paths.results[1].stat.exists or
            (atlas_icloudpd_photo_paths.results[1].stat.isdir | default(false) and
             atlas_icloudpd_photo_paths.results[2].stat.isreg | default(false))
        fail_msg: >-
          Photobook must exist and be immich-owned; an existing iCloudPD target
          must carry its managed marker. Never adopt or replace unrelated data.

    - name: Enable POSIX ACLs only on Photobook for a targeted traversal grant
      community.general.zfs:
        name: "{{ atlas_zfs_pool }}/{{ atlas_zfs_dataset_photobook }}"
        state: present
        extra_zfs_properties:
          acltype: posix

    - name: Allow the rootless administrator to traverse Photobook without listing it
      ansible.posix.acl:
        path: "{{ atlas_photobook_mountpoint }}"
        etype: user
        entity: "{{ atlas_admin_username }}"
        permissions: x
        state: present

    - name: Create a dedicated ZFS dataset for iCloudPD configuration and MFA
      community.general.zfs:
        name: "{{ atlas_icloudpd_dataset }}"
        state: present
        extra_zfs_properties:
          compression: zstd
          mountpoint: "{{ atlas_icloudpd_state_dir }}"

    - name: Restrict iCloudPD state and create the new photo subtree
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ atlas_admin_username }}"
        group: "{{ item.group | default(atlas_admin_group) }}"
        mode: "{{ item.mode }}"
      loop:
        - path: "{{ atlas_icloudpd_state_dir }}"
          mode: "0700"
        - path: "{{ atlas_icloudpd_config_dir }}"
          mode: "0700"
        - path: "{{ atlas_icloudpd_photos_dir }}"
          group: "{{ atlas_immich_group }}"
          mode: "2750"
        - path: "{{ atlas_icloudpd_quadlet_dir }}"
          mode: "0700"
      loop_control:
        label: "{{ item.path }}"

    - name: Let the NFS-mapped Immich identity read future iCloudPD files
      ansible.posix.acl:
        path: "{{ atlas_icloudpd_photos_dir }}"
        default: true
        etype: user
        entity: "{{ atlas_immich_username }}"
        permissions: rx
        state: present
      when: not ansible_check_mode or atlas_icloudpd_photo_paths.results[1].stat.exists

    - name: Mark only the newly managed iCloudPD photo subtree
      ansible.builtin.copy:
        content: "Atlas iCloudPD photo subtree; do not remove source photos.\n"
        dest: "{{ atlas_icloudpd_photos_dir }}/.atlas-icloudpd-managed"
        owner: "{{ atlas_admin_username }}"
        group: "{{ atlas_admin_group }}"
        mode: "0600"
        force: false

    - name: Install the image's required mounted-filesystem failsafe
      ansible.builtin.copy:
        content: ""
        dest: "{{ atlas_icloudpd_photos_dir }}/.mounted"
        owner: "{{ atlas_admin_username }}"
        group: "{{ atlas_admin_group }}"
        mode: "0644"
        force: false

    - name: Render the rootless Atlas iCloudPD Quadlet
      ansible.builtin.template:
        src: atlas-icloudpd.container.j2
        dest: "{{ atlas_icloudpd_quadlet_dir }}/atlas-icloudpd.container"
        owner: "{{ atlas_admin_username }}"
        group: "{{ atlas_admin_group }}"
        mode: "0644"

    - name: Check whether admin already has the pinned iCloudPD image
      become_user: "{{ atlas_admin_username }}"
      ansible.builtin.command:
        argv: [podman, image, exists, "{{ atlas_icloudpd_image }}"]
      environment:
        HOME: "{{ atlas_admin_home }}"
        XDG_RUNTIME_DIR: "/run/user/{{ atlas_admin_uid }}"
      register: atlas_icloudpd_image_present
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Pull only the declared, digest-pinned iCloudPD image
      become_user: "{{ atlas_admin_username }}"
      ansible.builtin.command:
        argv: [podman, pull, "{{ atlas_icloudpd_image }}"]
      environment:
        HOME: "{{ atlas_admin_home }}"
        XDG_RUNTIME_DIR: "/run/user/{{ atlas_admin_uid }}"
      when:
        - atlas_icloudpd_image_present.rc != 0
        - not ansible_check_mode

    - name: Require the existing Apple ID only for explicit startup
      ansible.builtin.assert:
        that:
          - atlas_icloudpd_apple_id | length > 0
          - "'\n' not in atlas_icloudpd_apple_id"
        fail_msg: Store the iCloudPD Apple ID in Vault before starting Atlas.
      no_log: true
      when: atlas_icloudpd_start | bool

    - name: Render private iCloudPD configuration before explicit startup
      ansible.builtin.template:
        src: atlas-icloudpd.conf.j2
        dest: "{{ atlas_icloudpd_config_dir }}/icloudpd.conf"
        owner: "{{ atlas_admin_username }}"
        group: "{{ atlas_admin_group }}"
        mode: "0600"
      no_log: true
      diff: false
      when: atlas_icloudpd_start | bool

    - name: Reload admin's user manager without starting iCloudPD
      become_user: "{{ atlas_admin_username }}"
      ansible.builtin.systemd:
        scope: user
        daemon_reload: true
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ atlas_admin_uid }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ atlas_admin_uid }}/bus"
      when: not ansible_check_mode

    - name: Start the rootless iCloudPD service only after explicit approval
      become_user: "{{ atlas_admin_username }}"
      ansible.builtin.systemd:
        name: atlas-icloudpd.service
        scope: user
        state: started
        enabled: true
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ atlas_admin_uid }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ atlas_admin_uid }}/bus"
      when:
        - atlas_icloudpd_start | bool
        - not ansible_check_mode

---
ansible_python_interpreter: /usr/bin/python3
username: fscotto
user_group: fscotto
user_home: "/home/{{ username }}"
user_shell: /bin/bash
effective_username: "{{ username }}"
effective_user_group: "{{ user_group }}"
effective_user_home: "{{ user_home }}"

xdg_user_directories:
  - Desktop
  - Documents
  - Downloads
  - Music
  - Pictures
  - Public
  - Templates
  - Videos

common_packages:
  - bash-completion
  - bat
  - entr
  - fzf
  - git
  - jq
  - tree
  - unzip
  - vim
  - wget
  - zip
  - zoxide

common_dotfiles:
  - name: .bashrc
    src: .bashrc
    dest: .bashrc
    mode: "0644"
  - name: .bash_profile
    src: .bash_profile
    dest: .bash_profile
    mode: "0644"
  - name: .bashrc.aliases
    src: .bashrc.aliases
    dest: .bashrc.aliases
    mode: "0644"
  - name: .vimrc
    src: .vimrc
    dest: .vimrc
    mode: "0644"
  - name: bat config
    src: .config/bat
    dest: .config/bat
    mode: preserve

ai_agents_npm_packages:
  - name: "opencode-ai"
    state: latest
  - name: "@openai/codex"
    state: latest
  - name: "@google/gemini-cli"
    state: latest

ai_agents_dotfiles:
  - name: AI common config
    src: .config/ai
    dest: .config/ai
    mode: preserve
  - name: Gemini CLI config
    src: .gemini
    dest: .gemini
    mode: preserve
  - name: OpenCode config
    src: .config/opencode
    dest: .config/opencode
    mode: preserve

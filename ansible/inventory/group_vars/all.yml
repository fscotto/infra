---
ansible_python_interpreter: /usr/bin/python3
username: fscotto
user_group: fscotto
user_home: "/home/{{ username }}"
user_shell: /bin/bash

xdg_user_directories:
  - Desktop
  - Documents
  - Downloads
  - Music
  - Pictures
  - Public
  - Templates
  - Videos

common_packages:
  - bash-completion
  - bat
  - tmux
  - git
  - tree
  - wget
  - unzip
  - zip
  - vim
  - fzf
  - zoxide
  - entr
  - jq

common_dotfiles:
  - name: .bashrc
    src: .bashrc
    dest: .bashrc
    mode: "0644"
  - name: .bash_profile
    src: .bash_profile
    dest: .bash_profile
    mode: "0644"
  - name: .tmux.conf
    src: .tmux.conf
    dest: .tmux.conf
    mode: "0644"
  - name: .vimrc
    src: .vimrc
    dest: .vimrc
    mode: "0644"
  - name: tmux config directory
    src: .tmux/
    dest: .tmux/
    mode: preserve
  - name: bat config
    src: .config/bat/.config/bat/
    dest: .config/bat/
    mode: preserve

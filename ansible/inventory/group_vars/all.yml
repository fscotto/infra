---
ansible_python_interpreter: /usr/bin/python3
username: fscotto
user_group: fscotto
user_home: "/home/{{ username }}"
user_shell: /bin/bash

common_packages:
  - bash-completion
  - bat
  - tmux
  - git
  - wget
  - unzip
  - zip
  - vim
  - fzf

common_dotfiles:
  - name: .bashrc
    src: .bashrc
    dest: .bashrc
    mode: "0644"
  - name: .bash_profile
    src: .bash_profile
    dest: .bash_profile
    mode: "0644"
  - name: .tmux.conf
    src: .tmux.conf
    dest: .tmux.conf
    mode: "0644"
  - name: tmux config directory
    src: .tmux/
    dest: .tmux/
    mode: preserve
  - name: bat config
    src: .config/bat/.config/bat/
    dest: .config/bat/
    mode: preserve

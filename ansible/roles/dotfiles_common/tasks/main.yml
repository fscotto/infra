---
- name: Copy common dotfiles
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../dotfiles/common/{{ item.src }}"
    dest: "{{ user_home }}/{{ item.dest }}"
    owner: "{{ username }}"
    group: "{{ user_group }}"
    mode: "{{ item.mode }}"
  loop: "{{ common_dotfiles | default([]) }}"
  loop_control:
    label: "{{ item.dest }}"
